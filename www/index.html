<style>

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d2128;--ink:#e8eaee;--mute:#cdd3dc;--line:#2d333c;--back:#17394a;--backink:#8fd3ef;--win:#4cc38a;--loss:#ff8a80}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1d2128;--ink:#e8eaee;--mute:#cdd3dc;--line:#2d333c;--back:#17394a;--backink:#8fd3ef;--win:#4cc38a;--loss:#ff8a80}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#b4bac4;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;padding:8px}
body.padp{padding-bottom:260px}
main{max-width:520px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
label{display:block;text-align:center;font-size:14px;font-weight:700;color:var(--mute);margin-bottom:2px}
label[for=o1],label[for=o2]{font-weight:700;color:var(--ink)}
input{width:100%;padding:5px 2px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:18px;font-weight:600;text-align:center;min-width:0;caret-color:#f26d6d}
input:focus,input.act{outline:2px solid var(--backink);outline-offset:1px;background:var(--back)}
.res{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 8px;padding:4px 0}
.res strong{font-size:18px}
.pos{color:var(--win)}.neg{color:var(--loss)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#r:empty{display:flex;justify-content:space-between;gap:8px;padding:12px 8px;color:var(--mute)}
#r:empty::before{content:"Profit: 00%"}
#r:empty::after{content:"Sure Win: 00 ৳"}
.stp{display:flex;gap:2px;align-items:stretch}
.stp button{flex:0 0 28px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font-size:22px;line-height:1;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
.stp button:active{background:var(--back)}
.stp button:focus-visible{outline:2px solid var(--backink)}
#pad{position:fixed;left:0;right:0;bottom:0;display:none;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 -4px 16px rgba(0,0,0,.12)}
#pad.on{display:block}
#pad .g{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:50px;gap:6px}
#pad button{border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:22px;font-weight:600;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
#pad button:active{background:var(--back)}
#pad .fn{font-size:18px;color:var(--ink)}
#pad .pv{grid-column:4;grid-row:2;font-size:18px;background:var(--back);color:var(--backink);border-color:var(--backink)}
#pad .nx{grid-column:4;grid-row:3;font-size:18px;background:var(--backink);color:var(--card);border-color:var(--backink)}
#pad .dn{grid-column:4;font-size:16px;background:#9b1111;color:#fff;border-color:#9b1111}
#pad button[data-k="b"]{background:#9b1111;color:#fff;border-color:#9b1111}
#pad .z{grid-column:1/3}
.hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.hh button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;font-weight:600;margin-left:6px;touch-action:manipulation;cursor:pointer}
#sv{background:var(--backink);color:var(--card);border-color:var(--backink)}
.hi{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;font-weight:600;cursor:pointer}
.hi small{color:var(--mute)}
input::placeholder{color:var(--mute);opacity:.7}
#r3{display:none;margin-top:10px}
body.m3 #r3{display:grid}
.tb .sw{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:48px;height:26px;border-radius:13px;border:1px solid var(--line);background:var(--bg);padding:0;cursor:pointer;touch-action:manipulation}
.sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--mute);transition:left .15s}
.sw b{position:absolute;top:0;right:8px;line-height:24px;font-size:13px;color:var(--mute)}
.sw.on{background:var(--backink);border-color:var(--backink)}
.sw.on i{left:24px;background:var(--card)}
.sw.on b{right:auto;left:9px;color:var(--card)}
.tb .rs{position:absolute;right:3px;top:50%;transform:translateY(-50%);height:22px;padding:0 6px;border-radius:11px;border:1px solid #9b1111;background:#9b1111;color:#fff;font:inherit;font-size:11px;font-weight:700;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.tb .rs:active{opacity:.8}
.aw{position:relative;flex:1;min-width:0;display:block}
.aw::after{content:"৳";position:absolute;right:7px;top:50%;transform:translateY(-50%);color:var(--mute);font-weight:700;font-size:16px;pointer-events:none}
.aw input{padding-left:22px;padding-right:22px}
.aw:has(input:placeholder-shown)::after{display:none}
.aw input:placeholder-shown{padding-left:2px;padding-right:2px}

.row>div{min-width:0}
.row>div:nth-child(3){display:none}
body.m3 .row>div:nth-child(3){display:block}
body.m3 .row{grid-template-columns:repeat(3,1fr)}
body.m3 .row .stp button{display:none}
body.m3 .row label{font-size:12px;white-space:nowrap;letter-spacing:-.2px}
.hc{flex:1;min-width:0}
.r1{display:flex;justify-content:space-between;gap:8px}
.hi .r1.pos,.hi .r1.neg{font-weight:700}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#b4bac4;z-index:10}
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;justify-content:center;gap:12px;align-items:baseline;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 12px;margin-bottom:6px}
.tb>span{font-size:18px;color:var(--ink);font-weight:700}
.tb strong{font-size:18px;font-variant-numeric:tabular-nums}
.tb strong .cu{font-size:18px;font-weight:700}
.tb{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tb.act{outline:2px solid var(--backink);outline-offset:1px;background:var(--back)}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
.tb.act #tvn::after{content:"";display:inline-block;width:3px;height:.9em;background:#f26d6d;margin-left:2px;vertical-align:-.1em;animation:bl 1s linear infinite}
.hi .x{flex:0 0 32px;height:32px;border:1px solid #9b1111;background:#9b1111;color:#fff;border-radius:8px;font-size:14px;cursor:pointer}

<script>
const $=id=>document.getElementById(id);

function fmtAmt(s){const p=s.replace(/,/g,"").split(".");p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,",");return p.length>1?p[0]+"."+p.slice(1).join(""):p[0]}
function formatAll(){AMT.forEach(id=>{const el=$(id),v=el.value,nv=fmtAmt(v);if(nv===v)return;let rc=null;if(id===cur&&typeof el.selectionStart==="number")rc=v.slice(0,el.selectionStart).replace(/,/g,"").length;el.value=nv;if(rc!==null){let c=0,pos=0;while(pos<nv.length&&c<rc){if(nv[pos]!==",")c++;pos++}try{el.setSelectionRange(pos,pos)}catch(e){}}})}

  const a=n("o1"),b=n("o2");

  const m=1/a+1/b;
  let s1,s2,T;
  if(src==="t"){T=n("t");s1=T/a/m;s2=T/b/m;setv("s1",s1);setv("s2",s2)}
  else if(src==="s1"){s1=n("s1");s2=s1*a/b;setv("s2",s2);setv("t",s1+s2)}

document.querySelectorAll(".stp button").forEach(bt=>{

  const step=(k=1)=>{
    const id=bt.dataset.t,el=$(id);

      el.value=Math.max(0,Math.round(v+bt.dataset.d*(k>1?10:1)));

  };
  const stop=()=>{clearTimeout(to);clearInterval(iv)};

/* Number pad */
const all=["o1","o2","s1","s2","o3","s3","t"],pad=$("pad");
let ids=["o1","o2","s1","s2","t"];
let cur=null,fresh=false,keep=false;
function moveCaret(d){
  if(!cur)return;const el=$(cur);fresh=false;
  const l=el.value.length;let p=typeof el.selectionStart==='number'?Math.min(el.selectionStart,l):l;
  p=Math.max(0,Math.min(l,p+d));
  try{el.setSelectionRange(p,p)}catch(e){}
}
function endCaret(el){try{const l=el.value.length;el.setSelectionRange(l,l)}catch(e){}}
const go=(id,kp)=>{keep=kp;openPad(id);const el=$(id);if(document.activeElement!==el)el.focus();keep=false;fresh=false;endCaret(el)};

all.forEach(id=>{const el=$(id);
  el.addEventListener("focus",()=>{if(window.quietFocus){window.quietFocus=false;endCaret(el);return}openPad(id);setTimeout(()=>{endCaret(el);el.scrollIntoView({block:"center",behavior:"smooth"})},60)});
  el.addEventListener("click",()=>endCaret(el));
  el.addEventListener("pointerdown",()=>{fresh=false});
});
function press(k){
  if(k==="done")return closePad();
  if(!cur)return;
  if(k==="prev"){const i=ids.indexOf(cur);return go(ids[(i+ids.length-1)%ids.length],true)}
  if(k==="next"){const i=ids.indexOf(cur);return go(ids[(i+1)%ids.length],false)}

  let sel=typeof el.selectionStart==='number'?Math.min(el.selectionStart,old.length):old.length;
  if(AMT.includes(cur)){sel=old.slice(0,sel).replace(/,/g,'').length;old=old.replace(/,/g,'')}
  let v,np;
  if(k==="b"){const p=fresh?old.length:sel;if(p<=0)return;v=old.slice(0,p-1)+old.slice(p);np=p-1}
  else{
    const base=fresh?"":old,p=fresh?0:sel;
    if(k==="."){if(base.includes("."))return;const pre=base.slice(0,p)||"0";v=pre+"."+base.slice(p);np=pre.length+1}
    else if(base==="0"&&p===1){v=k;np=1}
    else{v=base.slice(0,p)+k+base.slice(p);np=p+1}
  }
  if(v.length>10)return;
  if((cur==="o1"||cur==="o2"||cur==="o3")&&k!=="."&&k!=="b"){
    if(/^[1-9]$/.test(v)){v+=".";np=2}
  }
  fresh=false;el.value=v;try{el.setSelectionRange(np,np)}catch(e){}
  el.dispatchEvent(new Event("input"));
}
pad.querySelectorAll("button").forEach(bt=>{
  let to,iv,held=false,pend=false;
  const stop=()=>{clearTimeout(to);clearInterval(iv)};
  bt.addEventListener("pointerdown",e=>{
    e.preventDefault();stop();
    const k=bt.dataset.k;
    if(k==="prev"||k==="next"){held=false;pend=true;const d=k==="prev"?-1:1;to=setTimeout(()=>{held=true;pend=false;moveCaret(d);iv=setInterval(()=>moveCaret(d),320)},350);return}
    press(k);
    if(k==="b")to=setTimeout(()=>{iv=setInterval(()=>press("b"),70)},400);
  });
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>bt.addEventListener(ev,stop));
  bt.addEventListener("pointerup",()=>{if(pend&&!held){pend=false;press(bt.dataset.k)}});
  bt.addEventListener("contextmenu",e=>e.preventDefault());
});

if(!Array.isArray(H))H=[];

let bct;
$('bino').addEventListener('click',()=>{const on=!$('binl').classList.contains('on');$('binl').classList.toggle('on',on);$('bino').textContent=on?'Close':'Open';$('bino').setAttribute('aria-expanded',on?'true':'false')});

  const T=s.reduce((p,x)=>p+x,0);

  const e={o1:o[0],o2:o[1],s1:s[0],s2:s[1],t:T,w:Math.min(...s.map((x,i)=>x*o[i]-T)),ts:Date.now()};
  if(m3on){e.o3=o[2];e.s3=s[2]}

}
const MS={2:null,3:null};
const MF=['o1','o2','o3','s1','s2','s3','t'];
function setM3(on){
  if(on!==m3on){
    MS[m3on?3:2]={v:MF.map(id=>$(id).value),src:src};

}

function calc3(){
  const o=[n('o1'),n('o2'),n('o3')],sid=['s1','s2','s3'];
  if(o.some(x=>x<=1)){$('r').innerHTML='';return}
  const m=o.reduce((p,x)=>p+1/x,0);
  if(src==='t'){const T0=n('t');sid.forEach((id,i)=>setv(id,T0/o[i]/m))}
  else{const k=sid.indexOf(src),sk=n(src);sid.forEach((id,i)=>{if(i!==k)setv(id,sk*o[k]/o[i])});setv('t',sid.reduce((p,id)=>p+n(id),0))}

  if(T<=0){$('r').innerHTML='';return}

(function(){
  const ex=$('ex'),md=$('xm'),yes=$('xy'),no=$('xn');
  const show=on=>md.classList.toggle('on',on);
  ex.addEventListener('click',e=>{e.stopPropagation();show(true)});
  ex.addEventListener('keydown',e=>e.stopPropagation());
  no.addEventListener('click',()=>show(false));
  md.addEventListener('click',e=>{if(e.target===md)show(false)});
  md.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Escape')show(false)});
  yes.addEventListener('click',()=>{
    show(false);
    try{flushSave();saveState()}catch(x){}
    /* 1) ask the native app to close, 2) try closing the window, 3) never go "back" to the website page:
       show a closed screen instead (tap it to reopen) */
    if(nativeExit())return;
    try{window.close()}catch(x){}
    setTimeout(()=>{
      let c=document.getElementById('closed');
      if(!c){
        c=document.createElement('div');c.id='closed';
        c.style.cssText='position:fixed;inset:0;z-index:2147483600;background:#000;color:#888;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font:600 16px system-ui,sans-serif';
        c.innerHTML='App closed<br>Tap to reopen';
        c.addEventListener('click',()=>{c.remove();try{openPad('t');$('t').focus({preventScroll:true})}catch(x){}});
        document.body.appendChild(c);
      }
    },200);
  });
  /* phone back button: 1st press closes the number pad, next press asks to exit */
  /* Browsers (Chrome) mark the page's own history entry as "skip on back" if the page adds an entry before the user has touched it,
     which makes Back leave the page. So nothing is added at load; the extra entry is added at the first real tap/key only. */
  /* Entries must also be added during a real tap, never inside the Back (popstate) handler, or the browser skips them on the
     next Back. So several spare Back steps are added at once during taps, and topped up on every later tap. */
  const N=30;
  let armed=false;
  const depth=()=>{const s=history.state;return s&&s.g===2?(s.i||0):0};
  const refill=()=>{try{for(let k=depth()+1;k<=N;k++)history.pushState({g:2,i:k},'')}catch(x){}};
  /* on touch screens a tap only counts as a real user action when the finger lifts (pointerup/touchend/click), not on touchstart */
  const arm=()=>{
    if(armed)return;
    if(navigator.userActivation&&!navigator.userActivation.hasBeenActive)return;
    armed=true;
    try{history.replaceState({g:1},'')}catch(x){}
  };
  ['pointerdown','pointerup','touchstart','touchend','mousedown','mouseup','click','keydown'].forEach(ev=>document.addEventListener(ev,()=>{arm();if(armed)refill()},true));
  const onBack=()=>{
    if(md.classList.contains('on')){show(false);return}
    if($('nm').classList.contains('on')){window.noteShow(false);return}
    const pn=$('pnl');
    if(pn.classList.contains('on')){pn.classList.remove('on');$('st').classList.remove('on');$('st').setAttribute('aria-expanded','false');return}
    if(pad.classList.contains('on')){closePad();return}
    show(true);
  };
  window.addEventListener('popstate',()=>{if(!armed)return;onBack();setTimeout(refill,0)});
  /* some app WebViews send the Back button as a key instead of history */
  document.addEventListener('keydown',e=>{if(e.key==='GoBack'||e.key==='BrowserBack'||e.keyCode===4){e.preventDefault();onBack()}},true);
  /* native app can call window.handleBack() from its Back button; returns true when handled */
  window.handleBack=function(){onBack();return true};
  document.addEventListener('backbutton',e=>{e.preventDefault();onBack()});
  /* Capacitor: hardware Back button */
  try{if(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App&&Capacitor.Plugins.App.addListener){Capacitor.Plugins.App.addListener('backButton',()=>{onBack()})}}catch(e){}
})();

async function fetchTr(c){
  const fin=o=>{const r={};KEYS.forEach((k,i)=>{r[k]=String(o[i]).trim()});return r};
  const S=[async()=>{const o=(await gt(c,KEYS.join("\n"))).split("\n");if(o.length!==KEYS.length)throw new Error("count");return o},
    ()=>Promise.all(KEYS.map(k=>gt(c,k))),
    ()=>Promise.all(KEYS.map(k=>mm(c,k)))];
  for(const f of S){try{return fin(await f())}catch(e){lastErr=String(e&&e.message||e)}}
  return null;
}
function drawList(f){
  f=(f||"").trim().toLowerCase();ll.textContent="";
  ALL.forEach(x=>{
    if(f&&x[1].toLowerCase().indexOf(f)<0&&x[0].toLowerCase().indexOf(f)<0)return;
    const b=document.createElement("button");b.type="button";b.textContent=x[1];b.dataset.c=x[0];
    if(x[0]===lang)b.className="on";ll.appendChild(b);
  });
}
function openLg(){drawList("");lq.value="";lm2.classList.add("on");setTimeout(()=>{try{lq.focus()}catch(e){}},50)}
function closeLg(){lm2.classList.remove("on");lq.blur()}
async function pick(c){
  closeLg();
  if(c!=="en"&&c!=="bn"&&!ld(c)){
    toast("Loading… / লোড হচ্ছে…",0);
    const d=await fetchTr(c);
    if(!d){toast("This viewer blocks internet for apps. Open the file in Chrome for this language. / এই ভিউয়ার ইন্টারনেট আটকে দেয়। এই ভাষার জন্য ফাইলটা Chrome-এ খুলুন।",9000);return}
    try{localStorage.setItem("tbo_tr_"+c,JSON.stringify(d))}catch(e){}
    toast("");
  }
  setLang(c,true);lb.textContent=nm(lang);
}
lb.addEventListener("click",openLg);
document.getElementById("lgX").addEventListener("click",closeLg);
lq.addEventListener("input",()=>drawList(lq.value));
ll.addEventListener("click",e=>{const b=e.target.closest("button");if(b)pick(b.dataset.c)});
/* init */
let b0=100;try{b0=parseInt(localStorage.getItem("tbo_br"))||100}catch(e){}
setBr(b0,false);setH24(h24,false);setLang(lang,false);lb.textContent=nm(lang);
})();
</script>
